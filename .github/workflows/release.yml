name: Release

# Merge em main = release. Constroi e publica as imagens no GHCR e commita a nova tag no
# portal-gitops; o ArgoCD enxerga esse commit e faz o deploy. Nada aqui toca o cluster.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Duas releases seguidas nao podem disputar o commit de tag no portal-gitops.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/meloju/portal-app
  GITOPS_REPO: MeloJu/portal-gitops
  OVERLAY: lumi/overlays/prod/kustomization.yaml

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, tools-api]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Constroi sem publicar para o Trivy poder barrar antes do push.
      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy (barra CRITICAL com correcao disponivel)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}

  bump:
    # So roda se as tres imagens foram publicadas: o repositorio de manifests nunca aponta
    # para uma tag que nao existe.
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do portal-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: main
          # PAT fine-grained com Contents: write so no portal-gitops (docs/ci-cd.md).
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Atualiza as tags no overlay prod
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          for svc in backend frontend tools-api; do
            yq -i "(.images[] | select(.name == \"${IMAGE_PREFIX}-${svc}\")).newTag = \"${TAG}\"" "${OVERLAY}"
          done
          git diff --stat

      - name: Commit e push
        env:
          TAG: ${{ needs.images.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "Tags ja estavam em ${TAG}, nada a commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): portal-app ${TAG}" -m "Origem: ${RUN_URL}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push falhou (tentativa ${attempt}), tentando de novo"
            sleep 5
          done
          exit 1
