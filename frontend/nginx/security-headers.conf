# Cabecalhos de seguranca (SECURITY.md secao 13).
# Fica num snippet porque o nginx NAO herda add_header para um location que define o seu:
# todo bloco que usar add_header precisa incluir este arquivo de novo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://bypass.city; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
