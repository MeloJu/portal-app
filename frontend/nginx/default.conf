server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # A Travessia nao pode vazar o codigo curto para o site de destino.
    # "try_files /index.html =404" serve o arquivo aqui mesmo. Com "/index.html" como ULTIMO
    # argumento o nginx faria redirect interno e cairia no "location /", perdendo estes headers.
    location /r/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    # SPA: qualquer rota do React Router cai no index.html, que nunca fica em cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
