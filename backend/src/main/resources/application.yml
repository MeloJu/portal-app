spring:
  application:
    name: l2-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Base publica dos links e chave da sessao: sempre do ambiente, nunca com default.
app:
  public-base-url: ${PUBLIC_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
    ttl: 8h
  session:
    secure-cookie: ${SESSION_COOKIE_SECURE:true}

# Actuator em porta separada: o Ingress so roteia a 8080 (docs/SECURITY.md, secao 7).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      # Publica os buckets do histograma de latencia (http_server_requests_seconds_bucket);
      # sem isso o dashboard do Grafana nao consegue calcular p50/p95/p99.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
