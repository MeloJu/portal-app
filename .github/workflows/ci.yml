name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  tools-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools-api/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - run: ./mvnw -B verify

  images:
    # Garante que as tres imagens constroem e que o frontend entrega os cabecalhos de
    # seguranca (CSP, Referrer-Policy na Travessia), rodando com as restricoes do K8s.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: tools-api/Dockerfile
          failure-threshold: warning

      - run: docker build -t lumi-backend:test backend
      - run: docker build -t lumi-frontend:test frontend
      - run: docker build -t lumi-tools-api:test tools-api

      - run: scripts/smoke-images.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: scripts/check-config-secrets.sh .
