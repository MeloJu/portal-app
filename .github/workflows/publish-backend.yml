name: Publish backend image

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/publish-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/publish-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Constroi a imagem sem publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy barra CRITICAL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy reporta HIGH sem barrar
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Publica no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Resumo
        run: |
          {
            echo '### Imagem do backend'
            echo
            echo 'Trivy: nenhum CRITICAL com correcao disponivel (HIGH sai no log do job).'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            if [ -n '${{ steps.push.outputs.digest }}' ]; then
              echo
              echo "publicada, digest: \`${{ steps.push.outputs.digest }}\`"
            else
              echo
              echo 'nao publicada (pull request): a imagem so foi construida e escaneada.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
