openapi: 3.0.3
info:
  title: Lumi Links API
  version: 0.3.0
  description: |
    Contrato entre front e back. Mudou aqui? Abre PR e avisa o outro lado.

    Sessao por cookie: o login devolve `Set-Cookie: lumi_session=<jwt>` com `HttpOnly`,
    `Secure` e `SameSite=Strict`, valido por 8 horas e sem refresh token (Q47/Q48 em
    backend/docs/SECURITY.md). O front nao le nem monta o token: envia as requisicoes
    com credenciais e usa `POST /api/auth/logout` para encerrar.
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: account
  - name: links
  - name: travel
  - name: dashboard
  - name: protection
paths:
  # ---------- AUTH ----------
  /api/auth/register:
    post:
      tags: [auth]
      security: []
      summary: Cria um Usuário
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Criado e autenticado
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: E-mail já cadastrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Autentica e abre a sessão no cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '401': { description: Credenciais inválidas (mensagem genérica, não revela se o e-mail existe) }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/logout:
    post:
      tags: [auth]
      security: []
      summary: Encerra a sessão
      description: |
        Necessário porque o cookie é `HttpOnly`: o front não consegue apagá-lo sozinho.
        Responde com `Set-Cookie` de expiração imediata e é idempotente — não exige sessão
        válida, senão sair depois das 8 h de validade devolveria 401 em vez de limpar o
        cookie.
      responses:
        '204':
          description: Sessão encerrada
          headers:
            Set-Cookie: { $ref: '#/components/headers/ExpiredSessionCookie' }
  /api/auth/verify-email:
    post:
      tags: [auth]
      security: []
      summary: Confirma o e-mail com o token recebido por e-mail
      description: |
        Pública: o link `{PUBLIC_BASE_URL}/verificar-email?token=...` pode ser aberto sem
        sessão. O token vale por 30 minutos e só uma vez; só o hash fica no banco.
        Conta não verificada continua podendo entrar e usar a API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204': { description: E-mail confirmado }
        '400':
          description: |
            `TOKEN_INVALID` (inexistente, adulterado ou já usado), `TOKEN_EXPIRED` ou
            `VALIDATION_ERROR` (token vazio ou com mais de 100 caracteres).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/resend-verification:
    post:
      tags: [auth]
      summary: Reenvia o link de confirmação do e-mail
      description: |
        Invalida o link anterior. No máximo 1 envio a cada 60 segundos e 5 por hora por
        Usuário (o e-mail do cadastro conta como o primeiro).
      responses:
        '204': { description: Novo link enviado }
        '401': { description: Sem cookie de sessão ou sessão inválida }
        '409': { description: E-mail já confirmado (`ALREADY_VERIFIED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/oauth/{provider}:
    get:
      tags: [auth]
      security: []
      summary: Começa o login com Google ou GitHub
      description: |
        Navegação do browser (não é chamada `fetch`): redireciona com `302` ao provedor, pedindo
        apenas nome e e-mail (Google `openid email profile`; GitHub `read:user user:email`), com
        `state` e PKCE (`S256`). Define o cookie `lumi_oauth_state` (`HttpOnly`, `SameSite=Lax`,
        `Path=/api/auth/oauth`, 10 minutos), que guarda só o `state` assinado; o `code_verifier`
        nunca sai do servidor. O `redirect_uri` é `{PUBLIC_BASE_URL}/api/auth/oauth/callback/{provider}`
        e precisa estar cadastrado no app do provedor. Provedor sem credenciais configuradas:
        `302` para `{PUBLIC_BASE_URL}/login?oauth_error=OAUTH_DISABLED`. Limitada por IP,
        no mesmo balde do callback.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, github] }
      responses:
        '302': { description: 'Redirect ao provedor, ou a `/login?oauth_error=OAUTH_DISABLED` se desligado' }
        '404': { description: Provedor desconhecido }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/auth/oauth/callback/{provider}:
    get:
      tags: [auth]
      security: []
      summary: Retorno do provedor; abre a sessão e volta ao front
      description: |
        Chamado pelo provedor via redirect do browser. Valida o `state` contra o cookie
        `lumi_oauth_state` (obrigatório), troca o `code` com PKCE e aplica as regras de vinculação:
        identidade já conhecida entra na conta dona; e-mail NÃO verificado pelo provedor é recusado
        (`OAUTH_EMAIL_UNVERIFIED`); e-mail verificado igual ao de uma conta existente vincula (se a
        conta não estava verificada, ela passa a verificada e a senha anterior é invalidada,
        `hasPassword=false`); sem conta, cria uma (verificada, `hasPassword=false`).
        O destino do redirect é sempre `{PUBLIC_BASE_URL}/dashboard` ou
        `{PUBLIC_BASE_URL}/login?oauth_error=<código>`; nunca vem do request. Códigos:
        `OAUTH_DISABLED`, `OAUTH_STATE_INVALID`, `OAUTH_DENIED`, `OAUTH_EMAIL_UNVERIFIED`,
        `OAUTH_PROVIDER_ERROR`. Erros de negócio nunca viram `401`.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, github] }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: 'Sucesso: `Set-Cookie: lumi_session` e redirect a `/dashboard`. Falha: redirect a `/login?oauth_error=<código>`, sem sessão'
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
        '404': { description: Provedor desconhecido }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/me:
    get:
      tags: [auth]
      summary: Dados do Usuário logado
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { description: Sem cookie de sessão ou sessão inválida }

  /api/account/profile:
    patch:
      tags: [account]
      summary: Altera o nome da conta
      description: |
        Funciona também com o e-mail ainda não confirmado. O `name` é aparado (espaços
        das pontas, inclusive Unicode) ANTES da validação: vazio ou só espaços é
        `VALIDATION_ERROR`, e o limite de 120 caracteres (não bytes) vale para o nome já
        aparado. Caracteres de controle são rejeitados; acentos, apóstrofos e demais
        caracteres são mantidos como enviados. A conta é sempre a da sessão. A resposta traz
        um `Set-Cookie` novo, porque o JWT carrega o nome. Sessões emitidas antes continuam
        válidas até expirar (JWT sem estado), mas `/api/me` lê o nome do banco.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Nome alterado
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { description: '`VALIDATION_ERROR`: nome ausente, vazio, só espaços, com mais de 120 caracteres após o aparo ou com caracteres de controle', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Sem cookie de sessão ou sessão inválida }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/account/codes:
    post:
      tags: [account]
      summary: Pede um código de 6 dígitos para trocar o e-mail ou a senha
      description: |
        Exige e-mail confirmado. Para `EMAIL_CHANGE` o código vai para o NOVO e-mail
        (`newEmail`, normalizado em minúsculas, diferente do atual e livre); para
        `PASSWORD_CHANGE` vai para o e-mail atual e `newEmail` é ignorado. O código vale
        10 minutos, um novo pedido invalida o anterior, com intervalo mínimo de 60 segundos
        e no máximo 5 pedidos por hora por Usuário e finalidade. Só o hash fica no banco.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCodeRequest' }
      responses:
        '204': { description: Código enviado por e-mail }
        '400': { description: '`VALIDATION_ERROR`: finalidade desconhecida, `newEmail` ausente, inválido ou igual ao atual', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Sem cookie de sessão ou sessão inválida }
        '403': { description: E-mail da conta ainda não confirmado (`EMAIL_NOT_VERIFIED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Novo e-mail já cadastrado (`EMAIL_TAKEN`) ou, em `PASSWORD_CHANGE`, conta sem senha (`PASSWORD_NOT_SET`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/account/email:
    post:
      tags: [account]
      summary: Troca o e-mail com o código enviado ao novo endereço
      description: |
        Exige e-mail confirmado. A senha atual é conferida ANTES do código: senha errada
        não gasta tentativa nem o código. O código só vale para o `newEmail` para o qual
        foi emitido. O e-mail continua confirmado (o código o provou), o endereço antigo
        recebe um aviso e a resposta traz um `Set-Cookie` novo, porque o JWT carrega o
        e-mail. Sessões emitidas antes continuam válidas até expirar (JWT sem estado).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeEmailRequest' }
      responses:
        '200':
          description: E-mail trocado
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { description: '`VALIDATION_ERROR` (inclui e-mail igual ao atual), `CODE_INVALID` (errado, já usado ou de outro e-mail) ou `CODE_EXPIRED`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Sem cookie de sessão ou sessão inválida }
        '403': { description: '`EMAIL_NOT_VERIFIED` ou `WRONG_PASSWORD` (senha atual incorreta; não é 401 para não derrubar a sessão)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Novo e-mail já cadastrado (`EMAIL_TAKEN`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: '`CODE_ATTEMPTS_EXCEEDED` (5 palpites errados) ou `RATE_LIMIT` por IP', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/account/password:
    post:
      tags: [account]
      summary: Troca a senha com o código enviado ao e-mail atual
      description: |
        Exige e-mail confirmado. A senha atual é conferida ANTES do código: senha errada
        não gasta tentativa nem o código. A nova senha deve ter de 8 a 72 caracteres e ser
        diferente da atual. A resposta traz um `Set-Cookie` novo. Sessões emitidas antes
        continuam válidas até expirar (JWT sem estado).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200':
          description: Senha trocada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '400': { description: '`VALIDATION_ERROR` (inclui nova senha igual à atual), `CODE_INVALID` ou `CODE_EXPIRED`', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Sem cookie de sessão ou sessão inválida }
        '403': { description: '`EMAIL_NOT_VERIFIED` ou `WRONG_PASSWORD` (senha atual incorreta; não é 401 para não derrubar a sessão)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Conta sem senha (`PASSWORD_NOT_SET`): entra só por Google/GitHub', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: '`CODE_ATTEMPTS_EXCEEDED` (5 palpites errados) ou `RATE_LIMIT` por IP', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ---------- LINKS (do Usuário logado) ----------
  /api/links:
    post:
      tags: [links]
      summary: Cria um Link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkRequest' }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: E-mail da conta ainda não confirmado (code EMAIL_NOT_VERIFIED), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Alias já em uso, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [links]
      summary: Lista os Links do Usuário (Meus portais)
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/LinkState' } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LinkPage' } } } }
  /api/links/{code}:
    parameters: [ { $ref: '#/components/parameters/Code' } ]
    get:
      tags: [links]
      summary: Detalhe de um Link do Usuário
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        '404': { description: Não existe ou não é do Usuário }
    patch:
      tags: [links]
      summary: Edita destino, pausa/retoma ou muda a Validade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLinkRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Não existe ou não é do Usuário }
    delete:
      tags: [links]
      summary: Fecha o Link (soft delete)
      description: |
        O Link passa para o estado `CLOSED` e deixa de viajar (410 na Travessia), mas a
        linha e o histórico de Viagens continuam existindo: apagar de verdade faria os
        números da Visão geral caírem retroativamente. Operação idempotente.
      responses:
        '204': { description: Fechado }
        '404': { description: Não existe ou não é do Usuário }
  /api/links/{code}/stats:
    parameters: [ { $ref: '#/components/parameters/Code' } ]
    get:
      tags: [links]
      summary: Estatísticas de Viagens de um Link
      description: |
        `totalTravels`, `humanTravels`, `botTravels` e `countries` valem para todo o histórico do
        Link (inclusive Fechado). `travelsByDay` cobre os últimos `days` dias em UTC, com um ponto
        por dia e zero nos dias sem Viagem. Viagem sem país (GeoIP ainda não preenche) não entra
        em `countries`.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 90 },
            description: dias da janela, contando hoje (UTC); fora do intervalo é ajustado }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LinkStats' } } } }
        '404': { description: Não existe ou não é do Usuário }

  # ---------- TRAVEL (público) ----------
  /api/travel/{code}:
    parameters: [ { $ref: '#/components/parameters/Code' } ]
    get:
      tags: [travel]
      security: []
      summary: Registra a Viagem e devolve o destino (usado pela Travessia)
      responses:
        '200': { description: Viagem permitida, content: { application/json: { schema: { $ref: '#/components/schemas/TravelResponse' } } } }
        '404': { description: Código curto inexistente }
        '410': { description: Link Fechado (Ameaça bloqueada), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '423': { description: Link Pausado (Ameaça bloqueada), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /r/{code}:
    parameters: [ { $ref: '#/components/parameters/Code' } ]
    get:
      tags: [travel]
      security: []
      summary: Viagem direta sem Travessia (robôs e teste de carga)
      responses:
        '302':
          description: Redirecionamento (Cache-Control no-store)
          headers: { Location: { schema: { type: string } } }
        '404': { description: Código curto inexistente }
        '410': { description: Link Fechado }
        '423': { description: Link Pausado }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------- DASHBOARD (Visão geral + Viagens) ----------
  /api/dashboard/summary:
    get:
      tags: [dashboard]
      summary: Cards da Visão geral
      description: |
        `totalTravels` e `activeLinks` valem hoje; Links Fechados continuam somando Viagens.
        `travelsChangePct` compara os últimos `days` dias com os `days` dias anteriores.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 90 },
            description: tamanho da janela de comparação de travelsChangePct; fora do intervalo é ajustado }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
  /api/dashboard/travels:
    get:
      tags: [dashboard]
      summary: Série de Viagens por dia (Fluxo de viagens), consultada por polling
      description: Um ponto por dia (UTC) dos últimos `days` dias, com zero nos dias sem Viagem.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 12, minimum: 1, maximum: 90 },
            description: dias da janela, contando hoje (UTC); fora do intervalo é ajustado }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimePoint' } } } } }
  /api/dashboard/top-links:
    get:
      tags: [dashboard]
      summary: Ranking dos Links do Usuário com mais Viagens
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 5, minimum: 1, maximum: 20 },
            description: fora do intervalo é ajustado }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TopLink' } } } } }
  /api/dashboard/countries:
    get:
      tags: [dashboard]
      summary: Viagens por país (GeoIP, só código do país)
      description: Até 50 países, do maior para o menor. Viagem sem país não entra.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CountryCount' } } } } }

  # ---------- PROTECTION ----------
  /api/protection/summary:
    get:
      tags: [protection]
      summary: Ameaças bloqueadas e Destinos verificados do Usuário
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ProtectionSummary' } } } }
  /api/protection/events:
    get:
      tags: [protection]
      summary: Histórico recente de Ameaças bloqueadas
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 },
            description: fora do intervalo é ajustado }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlockedEvent' } } } } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lumi_session
      description: JWT HMAC de 8 h, HttpOnly, Secure, SameSite=Strict. Emitido por register/login.
  headers:
    SessionCookie:
      description: Cookie da sessão.
      schema:
        type: string
        example: lumi_session=<jwt>; Path=/; Max-Age=28800; HttpOnly; Secure; SameSite=Strict
    ExpiredSessionCookie:
      description: Cookie da sessão com expiração imediata.
      schema:
        type: string
        example: lumi_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Strict
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, example: aB3x9Q }
  responses:
    BadRequest:
      description: Dados inválidos (inclui URL inválida, loop e Alias reservado)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: |
        Balde por IP estourado (Bucket4j em memória). Conta como Ameaça `RATE_LIMIT`, uma
        vez por IP a cada janela — não uma por requisição barrada.
      headers:
        Retry-After:
          description: Segundos até o próximo token.
          schema: { type: integer }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120, example: Ana }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, maxLength: 100 }
    RequestCodeRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [EMAIL_CHANGE, PASSWORD_CHANGE] }
        newEmail: { type: string, format: email, maxLength: 254, description: obrigatório em EMAIL_CHANGE; ignorado em PASSWORD_CHANGE }
    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, description: Aparado antes de validar; sem caracteres de controle }
    ChangeEmailRequest:
      type: object
      required: [newEmail, code, currentPassword]
      properties:
        newEmail: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
        currentPassword: { type: string }
    ChangePasswordRequest:
      type: object
      required: [code, currentPassword, newPassword]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72, description: 'No máximo 72 bytes em UTF-8 (caracteres acentuados ocupam mais de 1 byte); acima disso responde 400 VALIDATION_ERROR' }
    AuthResponse:
      type: object
      description: O token não vem no corpo; viaja no cookie de sessão.
      properties:
        expiresIn: { type: integer, description: segundos, example: 28800 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        emailVerified: { type: boolean }
        hasPassword: { type: boolean, description: '`false` para conta criada ou assumida pelo login com Google/GitHub; não tem senha para trocar' }
    LinkState:
      type: string
      description: |
        Derivado, não armazenado: `CLOSED` cobre fechado manualmente, Validade vencida e
        `maxTravels` atingido, e tem precedência sobre `PAUSED`.
      enum: [ACTIVE, PAUSED, CLOSED]
    CreateLinkRequest:
      type: object
      required: [targetUrl]
      properties:
        targetUrl: { type: string, maxLength: 2048, example: facebook.com, description: sem esquema vira https:// }
        alias: { type: string, nullable: true, pattern: '^[a-zA-Z0-9-]{3,32}$' }
        title: { type: string, nullable: true, maxLength: 120, example: Campanha Nebulosa }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxTravels: { type: integer, nullable: true, minimum: 1 }
    UpdateLinkRequest:
      type: object
      properties:
        targetUrl: { type: string, maxLength: 2048 }
        title: { type: string, maxLength: 120 }
        paused: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxTravels: { type: integer, nullable: true, minimum: 1 }
    Link:
      type: object
      properties:
        code: { type: string, example: aB3x9Q }
        shortUrl: { type: string, example: https://l2.to/aB3x9Q }
        targetUrl: { type: string }
        title: { type: string, nullable: true }
        state: { $ref: '#/components/schemas/LinkState' }
        travelCount: { type: integer }
        expiresAt: { type: string, format: date-time, nullable: true }
        maxTravels: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    LinkPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Link' } }
        page: { type: integer }
        totalItems: { type: integer }
    TravelResponse:
      type: object
      properties:
        targetUrl: { type: string }
        title: { type: string, nullable: true }
        travelCount: { type: integer, description: inclui esta Viagem }
    LinkStats:
      type: object
      properties:
        code: { type: string }
        totalTravels: { type: integer }
        humanTravels: { type: integer }
        botTravels: { type: integer }
        travelsByDay: { type: array, items: { $ref: '#/components/schemas/TimePoint' } }
        countries: { type: array, items: { $ref: '#/components/schemas/CountryCount' } }
    DashboardSummary:
      type: object
      properties:
        activeLinks: { type: integer }
        totalTravels: { type: integer }
        travelsChangePct:
          type: number
          nullable: true
          description: |
            Variação percentual (uma casa) das Viagens dos últimos `days` dias contra os `days`
            anteriores. `null` quando o período anterior não teve Viagens: não existe percentual.
        blockedThreats: { type: integer }
    TimePoint:
      type: object
      properties:
        date: { type: string, format: date }
        travels: { type: integer }
    TopLink:
      type: object
      properties:
        code: { type: string }
        title: { type: string, nullable: true }
        travels: { type: integer }
    CountryCount:
      type: object
      properties:
        country: { type: string, example: BR }
        travels: { type: integer }
    ProtectionSummary:
      type: object
      properties:
        blockedThreats: { type: integer }
        verifiedDestinations:
          type: integer
          description: |
            Links do Usuário cujo destino passou pelo UrlValidator na criação ou no PATCH.
            Não conta análises do VirusTotal: elas rodam no tools-api, que é sem estado e
            sem identidade de Usuário.
        byReason:
          type: object
          description: Uma chave por motivo, inclusive os que estão em zero.
          additionalProperties: { type: integer }
          example: { INVALID_URL: 4, SELF_LOOP: 1, RESERVED_ALIAS: 2, PAUSED: 9, CLOSED: 3 }
    BlockedEvent:
      type: object
      properties:
        reason: { type: string, enum: [INVALID_URL, SELF_LOOP, RESERVED_ALIAS, PAUSED, CLOSED, RATE_LIMIT] }
        code: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        code: { type: string, example: ALIAS_TAKEN }
        message: { type: string, example: Esse nome de portal já foi pego }
