# Atras do Ingress o IP do cliente vem no X-Forwarded-For. O RemoteIpValve do Tomcat
# so aceita o header de proxies em faixa privada, entao getRemoteAddr() ja devolve o IP
# real sem dar ao cliente como forjar a chave do rate limit (docs/SECURITY.md, secao 11).
server:
  forward-headers-strategy: native

spring:
  application:
    name: l2-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# Base publica dos links e chave da sessao: sempre do ambiente, nunca com default.
app:
  public-base-url: ${PUBLIC_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
    ttl: 8h
  session:
    secure-cookie: ${SESSION_COOKIE_SECURE:true}
  # Balde por IP em memoria. O IP nunca e gravado: vive so como chave do bucket, que o
  # Caffeine descarta sozinho (docs/SECURITY.md, secao 11).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login:
      capacity: 5
      window: 1m
    register:
      capacity: 10
      window: 1h
    travel:
      capacity: 60
      window: 1m

# Actuator em porta separada: o Ingress so roteia a 8080 (docs/SECURITY.md, secao 7).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
